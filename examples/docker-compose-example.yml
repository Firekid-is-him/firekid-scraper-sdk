services:
  scraper:
    build: ..
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HEADLESS=true
      - NO_SANDBOX=true
      - API_HOST=0.0.0.0
      - API_KEY=${API_KEY:?Set API_KEY before starting}
      - CF_BYPASS=auto
    volumes:
      - ./output:/app/output
      - ./commands:/app/commands
