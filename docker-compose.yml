services:
  firekid-scraper:
    build: .
    container_name: firekid-scraper
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HEADLESS=true
      - NO_SANDBOX=true
      - API_HOST=0.0.0.0
      - API_KEY=${API_KEY:?Set API_KEY before starting the server}
      - CF_BYPASS=auto
      - LOG_LEVEL=info
      - MAX_QUEUE_WORKERS=5
      - API_PORT=3000
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./commands:/app/commands
    restart: unless-stopped
    networks:
      - firekid-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  firekid-network:
    driver: bridge
